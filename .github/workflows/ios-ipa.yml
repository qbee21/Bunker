name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Positive iOS build number"
        required: true
        default: "1"
        type: string
      sign_ipa:
        description: "Sign and export an IPA; false only exports the Xcode project (requires Apple secrets)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  IOS_BUNDLE_ID: com.starodymov.bunker
  IOS_EXPORT_PATH: ${{ github.workspace }}/artifacts/ipa
  IOS_XCODE_PROJECT: ${{ github.workspace }}/Builds/iOS/Unity-iPhone.xcodeproj

jobs:
  export_xcode:
    name: Export Unity Xcode project
    runs-on: ubuntu-latest
    outputs:
      unity_version: ${{ steps.unity-version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - id: unity-version
        name: Read Unity version
        shell: bash
        run: |
          value="$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)"
          test -n "$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-offline-v2-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-offline-v2-

      - name: Build unsigned iOS Xcode project
        uses: game-ci/unity-builder@v6
        # Unity exports the Xcode project successfully, but game-ci currently
        # returns exit code 1 during entitlement/license cleanup on this image.
        # The mandatory Verify Xcode export step below validates the real output.
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: iOS
          buildMethod: BunkerBuild.BuildIOSForCI
          buildsPath: Builds
          buildName: iOS
          versioning: Custom
          version: 1.0.0

      - name: Verify Xcode export
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f Builds/iOS/Unity-iPhone.xcodeproj/project.pbxproj
          test -f Builds/iOS/Info.plist

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: Builds/iOS
          if-no-files-found: error
          retention-days: 7

      - name: Explain skipped IPA export
        if: ${{ inputs.sign_ipa != true }}
        shell: bash
        run: |
          echo "IPA export skipped because sign_ipa=false."
          echo "Re-run this workflow with sign_ipa=true after configuring Apple signing secrets."

  validate_xcode_project:
    name: Validate exported iOS project
    needs: export_xcode
    # App Store Connect requires the iOS 26 SDK (Xcode 26+) for uploads.
    runs-on: macos-26
    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: ios-xcode-project
          path: Builds/iOS

      - name: Verify Xcode 26 or newer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk '/^Xcode / {split($2, v, "."); print v[1]}')"
          test "$major" -ge 26

      - name: Inspect iOS device build settings without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project Builds/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings > /dev/null

  sign_ipa:
    name: Sign and export IPA
    needs: export_xcode
    if: ${{ inputs.sign_ipa == true }}
    # App Store Connect requires the iOS 26 SDK (Xcode 26+) for uploads.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Gemfile
            fastlane
          sparse-checkout-cone-mode: false

      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: ios-xcode-project
          path: Builds/iOS

      - name: Verify Xcode 26 or newer
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | awk '/^Xcode / {split($2, v, "."); print v[1]}')"
          test "$major" -ge 26

      - name: Install signing certificate and provisioning profile
        shell: bash
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          test -n "$profile_name"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"

      - name: Validate profile bundle identifier and signing identity
        shell: bash
        env:
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          test "${application_identifier#*.}" = "$IOS_BUNDLE_ID"
          security find-identity -v -p codesigning | grep -q 'Apple Distribution'
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"

      - name: Install fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set iOS build number
        shell: bash
        run: |
          set -euo pipefail
          build_number='${{ inputs.build_number }}'
          case "$build_number" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          test "$build_number" -ge 1
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build_number }}" Builds/iOS/Info.plist

      - name: Archive and export signed IPA
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane ios build_ipa

      - name: Verify IPA signature and embedded profile
        shell: bash
        run: |
          set -euo pipefail
          ipa="$IOS_EXPORT_PATH/BunkerEvolution.ipa"
          test -f "$ipa"
          workdir="$RUNNER_TEMP/ipa-inspect"
          rm -rf "$workdir"
          mkdir -p "$workdir"
          unzip -q "$ipa" -d "$workdir"
          app="$(find "$workdir/Payload" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          test "$bundle_identifier" = "$IOS_BUNDLE_ID"
          security cms -D -i "$app/embedded.mobileprovision" > "$workdir/profile.plist"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$workdir/profile.plist")"
          test "${application_identifier#*.}" = "$IOS_BUNDLE_ID"
          rm -rf "$workdir"

      - name: Upload IPA, archive, and Xcode export
        uses: actions/upload-artifact@v4
        with:
          name: Bunker-Evolution-iOS-${{ inputs.build_number }}
          path: |
            artifacts/ipa/BunkerEvolution.ipa
            artifacts/ipa/BunkerEvolution.xcarchive
            Builds/iOS
          if-no-files-found: error
          retention-days: 14
